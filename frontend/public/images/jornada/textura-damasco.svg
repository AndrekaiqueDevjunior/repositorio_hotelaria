<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Damasco da Jornada Real. Ladrilha em 180x180: os motivos de canto e de
    meio de aresta são simétricos, então encaixam com o ladrilho vizinho.
    Usado como textura de fundo em opacidade baixa.
  -->
  <g fill="none" stroke="#cd9b40" stroke-width="1.1" stroke-linecap="round">
    <!-- treliça ogival -->
    <path d="M0 90 Q45 44 90 0 Q135 44 180 90 Q135 136 90 180 Q45 136 0 90 Z" opacity="0.85"/>
    <path d="M18 90 Q52 56 90 20 Q128 56 162 90 Q128 124 90 160 Q52 124 18 90 Z" opacity="0.4"/>

    <!-- arcos que fecham a treliça nos cantos -->
    <path d="M0 46 Q22 68 46 0" opacity="0.5"/>
    <path d="M180 46 Q158 68 134 0" opacity="0.5"/>
    <path d="M0 134 Q22 112 46 180" opacity="0.5"/>
    <path d="M180 134 Q158 112 134 180" opacity="0.5"/>
  </g>

  <!-- brasão do Hotel Real no centro de cada losango, no lugar do florão -->
  <image href="data:image/png;base64,"
    x="62" y="60" width="56" height="56" preserveAspectRatio="xMidYMid meet"/>

  <g fill="#cd9b40">
    <!-- estrelas de quatro pontas nos cantos: simétricas, ladrilham -->
    <path d="M0 0 L5 9 L0 18 L-5 9 Z"/>
    <path d="M0 0 L9 5 L18 0 L9 -5 Z"/>
    <path d="M180 0 L185 9 L180 18 L175 9 Z"/>
    <path d="M180 0 L189 5 L198 0 L189 -5 Z"/>
    <path d="M162 0 L171 5 L180 0 L171 -5 Z"/>
    <path d="M0 180 L5 189 L0 198 L-5 189 Z"/>
    <path d="M0 180 L9 185 L18 180 L9 175 Z"/>
    <path d="M180 180 L185 189 L180 198 L175 189 Z"/>
    <path d="M162 180 L171 185 L180 180 L171 175 Z"/>

    <!-- pérolas nos vértices da treliça -->
    <circle cx="90" cy="0" r="2.6"/>
    <circle cx="90" cy="180" r="2.6"/>
    <circle cx="0" cy="90" r="2.6"/>
    <circle cx="180" cy="90" r="2.6"/>
  </g>
</svg>
