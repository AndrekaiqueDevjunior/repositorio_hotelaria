<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!--
    Capitonê: o estofado em losangos com botão nos vértices, do tipo que
    forra encosto de trono. Ladrilha em 120x120 porque as diagonais cruzam
    de canto a canto e os botões ficam exatamente nos vértices.
    Textura do convite — deliberadamente diferente do damasco.
  -->
  <g stroke="#cd9b40" fill="none" stroke-linecap="round">
    <path d="M0 0 L120 120" stroke-width="1.1" opacity="0.7"/>
    <path d="M120 0 L0 120" stroke-width="1.1" opacity="0.7"/>
    <!-- vinco secundário, mais fino, que dá volume ao estofado -->
    <path d="M0 6 L114 120" stroke-width="0.5" opacity="0.3"/>
    <path d="M6 0 L120 114" stroke-width="0.5" opacity="0.3"/>
    <path d="M120 6 L6 120" stroke-width="0.5" opacity="0.3"/>
    <path d="M114 0 L0 114" stroke-width="0.5" opacity="0.3"/>
  </g>

  <g fill="#cd9b40">
    <!-- botões nos vértices (os de canto se completam com o ladrilho vizinho) -->
    <circle cx="60" cy="60" r="3.2"/>
    <circle cx="0" cy="0" r="3.2"/>
    <circle cx="120" cy="0" r="3.2"/>
    <circle cx="0" cy="120" r="3.2"/>
    <circle cx="120" cy="120" r="3.2"/>
  </g>

  <g fill="#cd9b40" opacity="0.45">
    <circle cx="60" cy="60" r="6" fill="none" stroke="#cd9b40" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#cd9b40" stroke-width="0.6"/>
    <circle cx="120" cy="0" r="6" fill="none" stroke="#cd9b40" stroke-width="0.6"/>
    <circle cx="0" cy="120" r="6" fill="none" stroke="#cd9b40" stroke-width="0.6"/>
    <circle cx="120" cy="120" r="6" fill="none" stroke="#cd9b40" stroke-width="0.6"/>
  </g>
</svg>
